name: Build and Release APK

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.1 or v1.1.0"
        required: false
        default: ""
      publish_release:
        description: "Publish GitHub Release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: miimeprivacy-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install Android 37 SDK and Build-Tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - name: Run unit tests, lint, and debug build
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:lintVitalRelease :app:assembleDebug --stacktrace --no-daemon
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miimeprivacy-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          retention-days: 7
      - name: Verify API 102 module metadata, DexKit packaging, and manifest in debug APK
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$DEBUG_APK"
          python3 - "$DEBUG_APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = set(zf.namelist())
              assert "classes.dex" in names, "classes.dex missing"
              assert "assets/xposed_init" not in names, "legacy assets/xposed_init must be absent"

              prop_raw = zf.read("META-INF/xposed/module.prop")
              assert b"\r" not in prop_raw, "META-INF/xposed/module.prop contains CR"
              prop_text = prop_raw.decode("utf-8")
              assert "minApiVersion=102" in prop_text, "minApiVersion=102 missing"
              assert "targetApiVersion=102" in prop_text, "targetApiVersion=102 missing"
              assert "staticScope=true" in prop_text, "staticScope=true missing"
              assert "exceptionMode=protective" in prop_text, "exceptionMode=protective missing"
              assert "autoHotReload=true" in prop_text, "autoHotReload=true missing"

              init_raw = zf.read("META-INF/xposed/java_init.list")
              assert b"\r" not in init_raw, "META-INF/xposed/java_init.list contains CR"
              assert init_raw.decode("utf-8").strip() == "com.scluzlep.miimeprivacy.xposed.MiImePrivacyModule"

              scope_raw = zf.read("META-INF/xposed/scope.list")
              assert b"\r" not in scope_raw, "META-INF/xposed/scope.list contains CR"
              scopes = {line.strip() for line in scope_raw.decode("utf-8").splitlines() if line.strip()}
              expected_scopes = {
                  "com.sohu.inputmethod.sogou.xiaomi",
                  "com.baidu.input_mi",
                  "com.xiaomi.type",
              }
              assert expected_scopes.issubset(scopes), f"scope.list missing targets: {expected_scopes - scopes}"

              dexkit_entries = {info.filename: info for info in zf.infolist() if info.filename.endswith("/libdexkit.so")}
              for abi in ("arm64-v8a", "armeabi-v7a"):
                  so_path = f"lib/{abi}/libdexkit.so"
                  assert so_path in dexkit_entries, f"{so_path} missing from APK"
              for filename, info in dexkit_entries.items():
                  assert info.file_size > 0, f"{filename} must be non-empty (got file_size={info.file_size})"
          print("Verified debug APK libxposed API 102 structure and extractable libdexkit.so")
          PY
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          MANIFEST_TREE="$("$BUILD_TOOLS/aapt2" dump xmltree "$DEBUG_APK" --file AndroidManifest.xml)"
          echo "$MANIFEST_TREE" | grep -Eq "android:extractNativeLibs.*=(true|\(type 0x12\)0x1)"
          echo "$MANIFEST_TREE" | grep -q "android.intent.category.LAUNCHER"
          echo "$MANIFEST_TREE" | grep -q "com.scluzlep.miimeprivacy.ACTION_OPEN_SETTINGS"
          echo "$MANIFEST_TREE" | grep -q "io.github.libxposed.service.XposedProvider"
          echo "$MANIFEST_TREE" | grep -q "com.scluzlep.miimeprivacy.bridge.PrivacySyncProvider"
          echo "$MANIFEST_TREE" | grep -q "com.scluzlep.miimeprivacy.bridge.PrivacySyncReceiver"
          echo "$MANIFEST_TREE" | grep -q "com.scluzlep.miimeprivacy.tile.CloudToggleTileService"
          if echo "$MANIFEST_TREE" | grep -q "xposedminversion"; then
            echo "::error::Legacy xposedminversion metadata present"
            exit 1
          fi
      - name: Verify v2.1 integration invariants
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          python3 - "$DEBUG_APK" "$BUILD_TOOLS" <<'PY'
          import os, pathlib, re, subprocess, sys

          debug_apk, build_tools = sys.argv[1], sys.argv[2]
          manifest_tree = subprocess.check_output(
              [os.path.join(build_tools, "aapt2"), "dump", "xmltree", debug_apk, "--file", "AndroidManifest.xml"],
              text=True,
          )

          # 1. Brand rename invariants ("Mi IMEPlus" only, zero "米输净盾" or "Mi IME Plus")
          brand_targets = [
              pathlib.Path("app/src/main/res/values/strings.xml"),
              pathlib.Path("app/src/main/java/com/scluzlep/miimeprivacy/ui/MainActivity.kt"),
              pathlib.Path("app/src/main/java/com/scluzlep/miimeprivacy/ui/screens/SettingsTab.kt"),
              pathlib.Path("app/src/main/java/com/scluzlep/miimeprivacy/xposed/overlay/QuickPanelViewFactory.kt"),
              pathlib.Path("README.md"),
          ]
          for path in brand_targets:
              text = path.read_text(encoding="utf-8")
              assert "Mi IMEPlus" in text, f"{path} missing exact brand 'Mi IMEPlus'"

          scan_files = [p for p in pathlib.Path("app/src").rglob("*") if p.is_file()] + [pathlib.Path("README.md")]
          for path in scan_files:
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              assert "米输净盾" not in text, f"Legacy brand '米输净盾' found in {path}"
              assert "Mi IME Plus" not in text, f"Forbidden spaced brand 'Mi IME Plus' found in {path}"

          # 2. Version & tag alignment invariants
          gradle_text = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")
          code_match = re.search(r'MIIME_VERSION_CODE[^\n]*\?:\s*(\d+)', gradle_text)
          name_match = re.search(r'MIIME_VERSION_NAME[^\n]*\?:\s*"([^"]+)"', gradle_text)
          assert code_match and code_match.group(1) == "2001001", f"versionCode default must be 2001001, got {code_match.group(1) if code_match else None}"
          assert name_match and name_match.group(1) == "2.1", f"versionName default must be '2.1', got {name_match.group(1) if name_match else None}"
          github_ref = os.environ.get("GITHUB_REF", "")
          if github_ref.startswith("refs/tags/v"):
              tag_ver = github_ref[len("refs/tags/v"):]
              assert tag_ver == name_match.group(1), f"Tag version v{tag_ver} does not match versionName '{name_match.group(1)}'"

          # 3. 74-rule HookRuleCatalog invariants + matching *HookPack.kt coverage + floating panel boundary
          spec_text = pathlib.Path("app/src/main/java/com/scluzlep/miimeprivacy/model/HookRuleSpec.kt").read_text(encoding="utf-8")
          const_map = dict(re.findall(r'const\s+val\s+(RULE_[A-Z0-9_]+)\s*=\s*"([^"]+)"', spec_text))
          catalog_match = re.search(r'private\s+val\s+catalog:\s*List<HookRuleSpec>\s*=\s*listOf\((.*?)\)\s*private\s+val\s+byId', spec_text, re.S)
          assert catalog_match, "Could not locate HookRuleCatalog.catalog list"
          raw_entries = re.findall(r'ruleId\s*=\s*(RULE_[A-Z0-9_]+|"[^"]+")', catalog_match.group(1))
          catalog_rules = []
          for raw in raw_entries:
              if raw.startswith('"'):
                  rid = raw.strip('"')
                  cname = None
              else:
                  cname = raw
                  rid = const_map[raw]
              catalog_rules.append((cname, rid))

          assert len(catalog_rules) == 74, f"Expected 74 catalog rules, got {len(catalog_rules)}"
          assert len({rid for _, rid in catalog_rules}) == 74, "Duplicate ruleId found in HookRuleCatalog"
          sogou_rules = [(c, r) for c, r in catalog_rules if r.startswith("sogou.")]
          baidu_rules = [(c, r) for c, r in catalog_rules if r.startswith("baidu.")]
          xiaoai_rules = [(c, r) for c, r in catalog_rules if r.startswith("xiaoai.")]
          assert len(sogou_rules) == 30, f"Expected 30 sogou.* rules, got {len(sogou_rules)}"
          assert len(baidu_rules) == 24, f"Expected 24 baidu.* rules, got {len(baidu_rules)}"
          assert len(xiaoai_rules) == 20, f"Expected 20 xiaoai.* rules, got {len(xiaoai_rules)}"

          titles = re.findall(r'title\s*=\s*"([^"]*)"', catalog_match.group(1))
          descriptions = re.findall(r'description\s*=\s*"([^"]*)"', catalog_match.group(1))
          assert len(titles) == 74 and len(descriptions) == 74, (
              f"Expected 74 titles/descriptions in catalog, got {len(titles)}/{len(descriptions)}"
          )
          for copy_text in titles + descriptions:
              for forbidden_ime in ("搜狗", "百度", "小爱", "小米"):
                  assert forbidden_ime not in copy_text, (
                      f"HookRuleCatalog copy must not contain '{forbidden_ime}': {copy_text}"
                  )

          pack_checks = [
              (pathlib.Path("app/src/main/java/com/scluzlep/miimeprivacy/xposed/targets/SogouHookPack.kt"), sogou_rules),
              (pathlib.Path("app/src/main/java/com/scluzlep/miimeprivacy/xposed/targets/BaiduHookPack.kt"), baidu_rules),
              (pathlib.Path("app/src/main/java/com/scluzlep/miimeprivacy/xposed/targets/XiaoAiHookPack.kt"), xiaoai_rules),
          ]
          for pack_path, rules in pack_checks:
              pack_text = pack_path.read_text(encoding="utf-8")
              missing = [r for c, r in rules if not ((c and c in pack_text) or (f'"{r}"' in pack_text))]
              assert not missing, f"{pack_path.name} missing rule IDs: {missing}"

          quick_panel = pathlib.Path("app/src/main/java/com/scluzlep/miimeprivacy/xposed/overlay/QuickPanelViewFactory.kt").read_text(encoding="utf-8")
          for forbidden in (
              "HookRuleCatalog.allRules",
              "HookRuleCatalog.rulesFor",
              "withRuleOverride",
              "isRuleToggleChecked",
              "符号缓存",
              "clearCacheNow",
              "clearSymbolCacheForTarget",
              "SymbolResolveMode",
              "DexKit",
          ):
              assert forbidden not in quick_panel, f"QuickPanelViewFactory must not contain '{forbidden}'"

          # 4. Config, UI, and unit test presence invariants
          cfg = pathlib.Path("app/src/main/java/com/scluzlep/miimeprivacy/config/PrivacyConfig.kt").read_text(encoding="utf-8")
          assert re.search(r"MIN_PILL_ALPHA\s*=\s*0\.10f", cfg), "PrivacyConfig MIN_PILL_ALPHA must be 0.10f"
          assert re.search(r"MAX_PILL_OFFSET_DP\s*=\s*2000\b", cfg), "PrivacyConfig MAX_PILL_OFFSET_DP must be 2000"
          assert "hidePillInLandscape" in cfg, "PrivacyConfig missing hidePillInLandscape"
          assert "SymbolResolveMode" in cfg, "PrivacyConfig missing SymbolResolveMode"
          assert "KEY_RULE_OVERRIDES" in cfg and "KEY_CONFIG_VERSION" in cfg, "PrivacyConfig missing v2 rule_overrides/config_version"

          settings = pathlib.Path("app/src/main/java/com/scluzlep/miimeprivacy/ui/screens/SettingsTab.kt").read_text(encoding="utf-8")
          assert '"关于"' in settings, "SettingsTab missing 关于 title"
          assert '"Scluzlep"' in settings, "SettingsTab missing Scluzlep developer credit"
          assert "https://github.com/Scluzlep/miimeprivacy" in settings, "SettingsTab missing GitHub URL"
          assert "exportConfigJson" in settings and "importConfigJson" in settings, "SettingsTab missing JSON import/export"
          for removed in ("关于与安全边界", "Xposed 与签名校验规范", "已审计目标输入法基准版本", "透明与克制原则", "dexkit_cache_card", "dexkit_cache_title"):
              assert removed not in settings, f"SettingsTab still contains removed section: {removed}"

          overview = pathlib.Path("app/src/main/java/com/scluzlep/miimeprivacy/ui/screens/OverviewTab.kt").read_text(encoding="utf-8")
          assert "GlobalCloudCard" in overview and "allowCloudInput" in overview, "OverviewTab missing GlobalCloudCard/allowCloudInput"
          assert "清除 DexKit 符号缓存" in overview, "OverviewTab missing clear DexKit cache button"
          assert "当前解析方式" in overview, "OverviewTab missing resolve method label"

          rules_tab = pathlib.Path("app/src/main/java/com/scluzlep/miimeprivacy/ui/screens/RulesTab.kt").read_text(encoding="utf-8")
          assert "put(it, true)" not in rules_tab, "RulesTab must not default-expand all categories via put(it, true)"
          assert "ImeTarget" in rules_tab and "RuleCategory" in rules_tab, "RulesTab missing 3-level ImeTarget/RuleCategory grouping"
          assert "formatRuleStatusBadge" in rules_tab, "RulesTab missing formatRuleStatusBadge"
          assert "setRuleEnabled" in rules_tab and "resetPackageDefaults" in rules_tab, "RulesTab missing fine-grained v2 rule controls"
          assert "›" not in rules_tab, "RulesTab must not contain '›' IME prefix"
          assert "shortImeName" not in rules_tab, "RulesTab must not contain shortImeName prefix helper"
          assert '"已接管"' in rules_tab, "RulesTab must display plain '已接管' without IME prefix"

          symbol_resolver = pathlib.Path("app/src/main/java/com/scluzlep/miimeprivacy/xposed/SymbolResolver.kt").read_text(encoding="utf-8")
          assert "interface DexKitExecutor" in symbol_resolver, "SymbolResolver.kt must define DexKitExecutor"
          assert "listOf(tryCache, tryDexKit, tryStructural)" in symbol_resolver, "SymbolResolver.kt DYNAMIC mode must use pure listOf(tryCache, tryDexKit, tryStructural)"
          assert "listOf(tryCache, tryDexKit, tryStructural, tryFastPath)" not in symbol_resolver, "SymbolResolver.kt DYNAMIC mode must not fall back to tryFastPath"

          for test_file in (
              "app/src/test/java/com/scluzlep/miimeprivacy/config/PrivacyConfigV2Test.kt",
              "app/src/test/java/com/scluzlep/miimeprivacy/ui/viewmodel/PrivacyUiViewModelTest.kt",
          ):
              assert pathlib.Path(test_file).is_file(), f"Missing required v2 unit test: {test_file}"

          lines = manifest_tree.splitlines()
          fp = None
          for idx, line in enumerate(lines):
              if re.match(r"^\s*E:\s+provider\b", line):
                  indent = len(line) - len(line.lstrip())
                  block = [line]
                  for nxt in lines[idx + 1:]:
                      if nxt.strip() and (len(nxt) - len(nxt.lstrip())) <= indent:
                          break
                      block.append(nxt)
                  block_text = "\n".join(block)
                  if "androidx.core.content.FileProvider" in block_text:
                      fp = block_text
                      break
          assert fp is not None, "FileProvider missing from AndroidManifest.xml"
          assert ".archiveprovider" in fp, "FileProvider missing .archiveprovider authority"
          assert re.search(r"android:exported(?:\(0x[0-9a-f]+\))?=(?:false|\(type 0x12\)0x0)\b", fp), f"FileProvider must have exported=false:\n{fp}"

          print("Verified v2.1 integration invariants")
          PY
      - name: Upload PR debug APK artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: miimeprivacy-debug-pr-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

  build-and-release:
    needs: check
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install Android 37 SDK and Build-Tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"

      - name: Resolve version tag and Gradle version overrides
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          DEFAULT_CODE="$(sed -n 's/.*MIIME_VERSION_CODE.*?: *\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          DEFAULT_VER="$(sed -n 's/.*MIIME_VERSION_NAME.*?: *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          DEFAULT_CODE="${DEFAULT_CODE:-1000001}"
          DEFAULT_VER="${DEFAULT_VER:-1.0}"
          SHORT_SHA="${GITHUB_SHA::7}"

          derive_version_env() {
            local raw_tag="$1"
            if [[ ! "$raw_tag" =~ ^v([0-9]+)\.([0-9]+)(\.([0-9]+))?([+-].*)?$ ]]; then
              echo "::error::Tag must match vMAJOR.MINOR or vMAJOR.MINOR.PATCH, got: $raw_tag"
              exit 1
            fi
            local major=$((10#${BASH_REMATCH[1]}))
            local minor=$((10#${BASH_REMATCH[2]}))
            local patch=$((10#${BASH_REMATCH[4]:-0}))
            if ((minor >= 1000 || patch >= 1000)); then
              echo "::error::Minor and patch version components must stay below 1000"
              exit 1
            fi
            local vcode=$((major * 1000000 + minor * 1000 + patch + 1))
            if ((vcode > 2100000000)); then
              echo "::error::Android versionCode limit exceeded"
              exit 1
            fi
            echo "MIIME_VERSION_NAME=${raw_tag#v}" >> "$GITHUB_ENV"
            echo "MIIME_VERSION_CODE=${vcode}" >> "$GITHUB_ENV"
          }

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "${TAG#v}" != "${DEFAULT_VER}" ]]; then
              echo "::error::Release tag ${TAG} does not match app/build.gradle.kts versionName '${DEFAULT_VER}'"
              exit 1
            fi
            DO_RELEASE="true"
            derive_version_env "$TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "::error::Tag ref must start with refs/tags/v, got: ${GITHUB_REF}"
            exit 1
          elif [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
            DO_RELEASE="${INPUT_PUBLISH}"
            if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)(\.([0-9]+))?([+-].*)?$ ]]; then
              derive_version_env "$TAG"
            fi
          else
            TAG="v${DEFAULT_VER}-${SHORT_SHA}"
            DO_RELEASE="${INPUT_PUBLISH}"
          fi

          echo "version_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "do_release=${DO_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved version_tag=${TAG} do_release=${DO_RELEASE}"

      - name: Validate SigHelper secrets before release
        if: steps.meta.outputs.do_release == 'true'
        shell: bash
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "::error::Missing secret SIGNING_KEYSTORE_BASE64. Sync via SigHelper android-sig."; exit 1; }
          test -n "$SIGNING_PASSWORD" || { echo "::error::Missing secret SIGNING_PASSWORD. Sync via SigHelper android-sig."; exit 1; }

      - name: Lint and build unsigned release APK
        run: gradle :app:lintVitalRelease :app:assembleRelease --stacktrace --no-daemon

      - name: Zipalign, sign with SigHelper PKCS#12 secrets, and verify APK
        id: sign
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.version_tag }}"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$BUILD_TOOLS"
          mkdir -p dist work

          RAW_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [[ ! -f "$RAW_APK" ]]; then
            RAW_APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          fi
          test -s "$RAW_APK"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$RAW_APK" work/aligned.apk

          if [[ -n "${SIGNING_KEYSTORE_BASE64:-}" && -n "${SIGNING_PASSWORD:-}" ]]; then
            umask 077
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
            test -s "$RUNNER_TEMP/release.p12"

            ALIAS_ARGS=()
            if [[ -n "${SIGNING_KEY_ALIAS:-}" ]]; then
              ALIAS_ARGS+=(--ks-key-alias "$SIGNING_KEY_ALIAS")
            fi
            KEY_PASS="${SIGNING_KEY_PASSWORD:-$SIGNING_PASSWORD}"
            export KEY_PASS

            APK_NAME="miimeprivacy-${TAG}.apk"
            OUT_APK="dist/${APK_NAME}"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.p12" \
              --ks-type PKCS12 \
              "${ALIAS_ARGS[@]}" \
              --ks-pass env:SIGNING_PASSWORD \
              --key-pass env:KEY_PASS \
              --out "$OUT_APK" \
              work/aligned.apk

            CERT_LOG="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT_APK")"
            echo "$CERT_LOG"
            CERT_SHA="$(printf '%s\n' "$CERT_LOG" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"

            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "cert_sha256=$CERT_SHA" >> "$GITHUB_OUTPUT"
          else
            APK_NAME="miimeprivacy-${TAG}-unsigned.apk"
            OUT_APK="dist/${APK_NAME}"
            cp work/aligned.apk "$OUT_APK"
            echo "::notice::SigHelper secrets not set; produced unsigned APK artifact only."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "cert_sha256=unsigned" >> "$GITHUB_OUTPUT"
          fi

          MANIFEST_TREE="$("$BUILD_TOOLS/aapt2" dump xmltree "$OUT_APK" --file AndroidManifest.xml)"
          echo "$MANIFEST_TREE" | grep -Eq "android:extractNativeLibs.*=(true|\(type 0x12\)0x1)"
          echo "$MANIFEST_TREE" | grep -q "android.intent.category.LAUNCHER"
          echo "$MANIFEST_TREE" | grep -q "com.scluzlep.miimeprivacy.ACTION_OPEN_SETTINGS"
          echo "$MANIFEST_TREE" | grep -q "io.github.libxposed.service.XposedProvider"
          echo "$MANIFEST_TREE" | grep -q "com.scluzlep.miimeprivacy.bridge.PrivacySyncProvider"
          echo "$MANIFEST_TREE" | grep -q "com.scluzlep.miimeprivacy.bridge.PrivacySyncReceiver"
          echo "$MANIFEST_TREE" | grep -q "com.scluzlep.miimeprivacy.tile.CloudToggleTileService"
          if echo "$MANIFEST_TREE" | grep -q "xposedminversion"; then
            echo "::error::Legacy xposedminversion metadata present in release APK"
            exit 1
          fi

          BADGING_OUT="$("$BUILD_TOOLS/aapt2" dump badging "$OUT_APK")"
          echo "$BADGING_OUT" | grep -q "package: name='com.scluzlep.miimeprivacy'"
          echo "$BADGING_OUT" | grep -q "launchable-activity: name='com.scluzlep.miimeprivacy.ui.MainActivity'"

          if [[ "${GITHUB_REF}" == refs/heads/main || "${GITHUB_REF}" == refs/tags/v* ]]; then
            python3 - "$MANIFEST_TREE" <<'PY'
          import re, sys
          lines = sys.argv[1].splitlines()
          fp = None
          for idx, line in enumerate(lines):
              if re.match(r"^\s*E:\s+provider\b", line):
                  indent = len(line) - len(line.lstrip())
                  block = [line]
                  for nxt in lines[idx + 1:]:
                      if nxt.strip() and (len(nxt) - len(nxt.lstrip())) <= indent:
                          break
                      block.append(nxt)
                  block_text = "\n".join(block)
                  if "androidx.core.content.FileProvider" in block_text:
                      fp = block_text
                      break
          assert fp is not None, "FileProvider missing from release AndroidManifest.xml"
          assert ".archiveprovider" in fp, "FileProvider missing .archiveprovider authority in release APK"
          assert re.search(r"android:exported(?:\(0x[0-9a-f]+\))?=(?:false|\(type 0x12\)0x0)\b", fp), f"Release FileProvider must have exported=false:\n{fp}"
          PY
          fi

          python3 - "$OUT_APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = set(zf.namelist())
              assert "classes.dex" in names
              assert "assets/xposed_init" not in names

              prop_raw = zf.read("META-INF/xposed/module.prop")
              assert b"\r" not in prop_raw
              prop = prop_raw.decode("utf-8")
              assert "minApiVersion=102" in prop
              assert "targetApiVersion=102" in prop
              assert "staticScope=true" in prop
              assert "exceptionMode=protective" in prop
              assert "autoHotReload=true" in prop

              init_raw = zf.read("META-INF/xposed/java_init.list")
              assert b"\r" not in init_raw
              assert init_raw.decode("utf-8").strip() == "com.scluzlep.miimeprivacy.xposed.MiImePrivacyModule"

              scope_raw = zf.read("META-INF/xposed/scope.list")
              assert b"\r" not in scope_raw
              scopes = {line.strip() for line in scope_raw.decode("utf-8").splitlines() if line.strip()}
              expected_scopes = {
                  "com.sohu.inputmethod.sogou.xiaomi",
                  "com.baidu.input_mi",
                  "com.xiaomi.type",
              }
              assert expected_scopes.issubset(scopes), f"scope.list missing targets: {expected_scopes - scopes}"

              dexkit_entries = {info.filename: info for info in zf.infolist() if info.filename.endswith("/libdexkit.so")}
              for abi in ("arm64-v8a", "armeabi-v7a"):
                  so_path = f"lib/{abi}/libdexkit.so"
                  assert so_path in dexkit_entries, f"{so_path} missing from release APK"
              for filename, info in dexkit_entries.items():
                  assert info.file_size > 0, f"{filename} must be non-empty in release APK (got file_size={info.file_size})"
          print("Verified release APK libxposed API 102 structure and extractable libdexkit.so")
          PY

          echo "apk_file=$OUT_APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Wipe temporary PKCS#12 keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/*.idsig
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload CI build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miimeprivacy-${{ steps.meta.outputs.version_tag }}
          path: dist/*
          retention-days: 14

      - name: Prepare GitHub Release notes
        if: steps.meta.outputs.do_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.version_tag }}"
          cat > work/release_notes.md <<EOF
          ## miimeprivacy ${TAG}

          - Xposed API: libxposed API 102
          - Targets: com.sohu.inputmethod.sogou.xiaomi (20160) / com.baidu.input_mi (7108) / com.xiaomi.type (21363)
          - APK: \`${{ steps.sign.outputs.apk_name }}\`
          - Signer SHA-256: \`${{ steps.sign.outputs.cert_sha256 }}\`

          ### Checksums
          \`\`\`text
          $(cat dist/SHA256SUMS.txt)
          \`\`\`

          ### Verify signature with SigHelper
          \`\`\`bash
          android-sig veri ${GITHUB_REPOSITORY} --apk ${{ steps.sign.outputs.apk_name }}
          \`\`\`
          EOF

      - name: Publish GitHub Release
        if: steps.meta.outputs.do_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.version_tag }}"
          APK_FILE="${{ steps.sign.outputs.apk_file }}"
          APK_NAME="${{ steps.sign.outputs.apk_name }}"
          SUM_PATH="dist/SHA256SUMS.txt"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "${APK_FILE}#${APK_NAME}" \
              "${SUM_PATH}#SHA256SUMS.txt" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --prerelease=false \
              --title "miimeprivacy ${TAG}" \
              --notes-file work/release_notes.md \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              "${APK_FILE}#${APK_NAME}" \
              "${SUM_PATH}#SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --title "miimeprivacy ${TAG}" \
              --notes-file work/release_notes.md
          fi
